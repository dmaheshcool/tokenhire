<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet" />
  <style>
    html,body{margin:0;background:#0B1020;font-family:Inter,system-ui,sans-serif}
    .f{width:1280px;height:720px;position:relative;overflow:hidden}
    .cap{position:absolute;left:0;right:0;bottom:0;padding:72px 40px 36px;background:linear-gradient(180deg,transparent,rgba(7,10,20,.82) 56%);color:#fff;font-size:34px;font-weight:650;letter-spacing:-.6px}
    .tile{width:64px;height:64px;border-radius:16px;background:#2C6BF5;color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Roboto Mono",monospace;font-weight:800;font-size:22px}
    .card{background:#fff;border-radius:22px;padding:28px 24px;box-shadow:0 24px 50px -28px rgba(17,19,24,.4)}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const f = new URLSearchParams(location.search).get("f") || "wait";
    const lines = {
      wait: "She knows how long. So does the floor.",
      nudge: "Keep the page open. It tells you when to go.",
      call: "HR taps once. The wall calls 014.",
      end: "By lunch you have names. Not paper.",
    };
    const body = {
      wait: `<div class="f" style="background:#F6F5F2;display:flex;align-items:center;justify-content:center">
        <div class="card" style="width:380px">
          <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px">
            <div class="tile">014</div>
            <div style="font-size:22px;font-weight:700">Priya Nair</div>
          </div>
          <div style="text-align:center;background:#F6F5F2;border-radius:16px;padding:28px 12px">
            <div style="font-size:72px;font-weight:800;color:#2C6BF5;letter-spacing:-2px;line-height:1">3</div>
            <div style="font-weight:600;margin-top:6px">people ahead</div>
            <div style="color:#6B7080;margin-top:6px">about 24 min</div>
          </div>
        </div>
        <div class="cap">${lines.wait}</div>
      </div>`,
      nudge: `<div class="f" style="background:#F6F5F2;display:flex;align-items:center;justify-content:center">
        <div class="card" style="width:380px;text-align:center">
          <div class="tile" style="margin:0 auto 16px">014</div>
          <div style="font-size:13px;letter-spacing:1.4px;font-weight:700;color:#2C6BF5">YOU'RE NEXT</div>
          <div style="font-size:22px;font-weight:700;margin-top:10px">Priya Nair</div>
          <div style="color:#6B7080;margin-top:8px;font-size:15px">Keep this page open. Sound when they call you.</div>
        </div>
        <div class="cap">${lines.nudge}</div>
      </div>`,
      call: `<div class="f" style="display:grid;grid-template-columns:1.15fr .85fr">
        <div style="padding:80px 48px;color:#fff">
          <div style="font-family:'Roboto Mono',monospace;letter-spacing:2px;color:#2C6BF5;font-weight:700;font-size:14px">NOW CALLING</div>
          <div style="font-family:'Roboto Mono',monospace;font-weight:700;font-size:110px;letter-spacing:-3px;line-height:.9">W-014</div>
          <div style="color:#C6CCE0;font-size:20px;font-weight:600;margin-top:12px">P···a  ·  Room 2</div>
        </div>
        <div style="background:#F6F5F2;display:flex;align-items:center;justify-content:center">
          <div class="card" style="width:280px">
            <div style="display:flex;align-items:center;gap:12px">
              <div class="tile" style="width:44px;height:44px;font-size:16px;border-radius:12px">014</div>
              <b>Priya Nair</b>
            </div>
            <div style="margin-top:16px;background:#2C6BF5;color:#fff;text-align:center;padding:12px;border-radius:999px;font-weight:700">Call · Room 2</div>
          </div>
        </div>
        <div class="cap">${lines.call}</div>
      </div>`,
      end: `<div class="f" style="background:#F6F5F2;display:flex;align-items:center;justify-content:center">
        <div style="text-align:center">
          <div style="display:inline-flex;align-items:center;gap:14px">
            <div class="tile">014</div>
            <div style="font-size:28px;font-weight:700">Priya Nair</div>
          </div>
          <div style="margin:18px auto 0;display:inline-block;background:#EEF3FF;color:#2C6BF5;font-weight:700;padding:8px 14px;border-radius:8px">Selected</div>
          <div style="font-family:'Roboto Mono',monospace;color:#6B7080;font-weight:600;margin-top:16px">50 in · 8 selected · 4 hold · 7 out</div>
        </div>
        <div class="cap">${lines.end}</div>
      </div>`,
    };
    document.getElementById("root").innerHTML = body[f] || body.wait;
  </script>
</body>
</html>
